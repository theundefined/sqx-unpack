[package]
name = "sqx-unpack"
version = "0.1.0"
edition = "2021"
description = "Open-source extractor for SQX (Squeez / SpeedCommander) archives"
license = "GPL-3.0-or-later"
repository = "https://github.com/theundefined/sqx-unpack"

[dependencies]

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[[bin]]
name = "sqx"
path = "src/main.rs"

[features]
# Test-data encoder (examples/mkarchive.rs); not needed for extraction.
encoder = []

[[example]]
name = "mkarchive"
required-features = ["encoder"]
